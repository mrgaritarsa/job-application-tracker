{% extends "base.html" %}
{% block title %}{{ action }} company{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ action }} company</h1>
<form method="post" class="card card-body form-card" novalidate>
    <div class="row g-3">
        <div class="col-md-6">
            <label for="company_name" class="form-label">Company name <span class="text-danger">*</span></label>
            <input id="company_name" name="company_name" class="form-control" maxlength="100" required
                   value="{{ company.company_name or '' }}">
        </div>
        <div class="col-md-6">
            <label for="industry" class="form-label">Industry</label>
            <input id="industry" name="industry" class="form-control" maxlength="50"
                   value="{{ company.industry or '' }}" placeholder="e.g. Software">
        </div>
        <div class="col-12">
            <label for="website" class="form-label">Website</label>
            <input id="website" name="website" type="url" class="form-control" maxlength="200"
                   value="{{ company.website or '' }}" placeholder="https://example.com">
        </div>
        <div class="col-md-6">
            <label for="city" class="form-label">City</label>
            <input id="city" name="city" class="form-control" maxlength="50" value="{{ company.city or '' }}">
        </div>
        <div class="col-md-6">
            <label for="state" class="form-label">State</label>
            <input id="state" name="state" class="form-control" maxlength="50" value="{{ company.state or '' }}">
        </div>
        <div class="col-12">
            <label for="notes" class="form-label">Notes</label>
            <textarea id="notes" name="notes" class="form-control" rows="3">{{ company.notes or '' }}</textarea>
        </div>
    </div>
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">{{ 'Save changes' if action == 'Edit' else 'Add company' }}</button>
        <a href="{{ url_for('company_detail', company_id=company.company_id) if company.company_id else url_for('companies') }}"
           class="btn btn-link">Cancel</a>
    </div>
</form>
{% endblock %}
