{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="card card-body text-center py-5">
    <h1 class="h4">Something went wrong</h1>
    <p class="text-muted">{{ message }}</p>
    {% if detail %}<pre class="small text-danger text-start mx-auto" style="max-width: 600px; white-space: pre-wrap;">{{ detail }}</pre>{% endif %}
    <div><a href="{{ url_for('dashboard') }}" class="btn btn-primary">Back to dashboard</a></div>
</div>
{% endblock %}
